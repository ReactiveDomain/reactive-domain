name: Release

# Pushing a v* tag publishes that version to nuget.org. MinVer reads the version off the tag, so the
# tag is the only place a release number is written.
#
# The API key is minted per run by exchanging a GitHub OIDC token, which requires a trusted publisher
# policy on nuget.org for every package id this ships. Until every id has one, a manual run with
# break_glass set pushes with the stored NUGET_API_KEY instead.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      break_glass:
        description: 'Push with the stored NUGET_API_KEY instead of trusted publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Publishing to nuget.org cannot be undone, only unlisted, so this job waits on the release
    # environment's reviewers before it pushes. The name is also a claim in the OIDC token, and the
    # nuget.org trusted publisher policy is set to require it: change one and the exchange fails.
    environment: release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # MinVer walks back to the nearest tag, so a shallow clone would version the build wrong.
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0
          10.0

    # No -f: every project builds the frameworks its own TargetFrameworks names, which for the
    # libraries is both net8.0 and net10.0. Narrowing here would ship a package missing a framework.
    - name: Build
      working-directory: src
      run: dotnet build ReactiveDomain.sln -c Release

    - name: Pack
      working-directory: src
      run: dotnet pack ReactiveDomain.sln -c Release --no-build

    - name: Exchange OIDC token for a short-lived NuGet key
      if: ${{ !inputs.break_glass }}
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push packages
      env:
        NUGET_API_KEY: ${{ inputs.break_glass && secrets.NUGET_API_KEY || steps.nuget-login.outputs.NUGET_API_KEY }}
      # Symbol packages ride along with the .nupkg of the same name; --skip-duplicate makes a re-run
      # after a partial push succeed.
      run: >
        dotnet nuget push "packages/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "$NUGET_API_KEY"
        --skip-duplicate
